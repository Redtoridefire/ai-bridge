<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Bridge</title>
<style>
:root{--bg:#0e1420;--panel:#161e2e;--line:#26304a;--ink:#e8edf6;--sub:#8d99b0;--accent:#3EE0C8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px -apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{color:var(--accent)}
select,button,input{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#07110e;border-color:var(--accent);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:5px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--sub)}
.tab.left{border-left:3px solid var(--accent);color:var(--ink)}
.tab.right{border-right:3px solid #F2B441;color:var(--ink)}
.tab .x{margin-left:8px;color:var(--sub)}
.tab .x:hover{color:#e0705e}
.hint{color:var(--sub);font-size:12px;width:100%}
.panes{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.paneWrap{background:var(--bg);display:flex;flex-direction:column;min-width:0}
.paneLabel{padding:3px 10px;font-size:12px;color:var(--sub);background:var(--panel)}
webview{flex:1;width:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--accent);color:#07110e;padding:8px 18px;border-radius:8px;font-weight:600;display:none;z-index:9}
</style>
</head>
<body>
<header>
  <b>AI Bridge</b>
  <div class="tabs" id="tabs"></div>
  <button onclick="addPane()">+ Add account</button>
  <span style="flex:1"></span>
  <button class="primary" onclick="share()">Share left ➜ right</button>
  <button onclick="share(true)">Share right ➜ left</button>
  <span class="hint">Click a tab to show it on the LEFT · Ctrl+click for the RIGHT · log in normally inside each pane — sessions are isolated per account and persist.</span>
</header>
<div class="panes">
  <div class="paneWrap"><div class="paneLabel" id="labL">—</div><div id="slotL" style="flex:1;display:flex"></div></div>
  <div class="paneWrap"><div class="paneLabel" id="labR">—</div><div id="slotR" style="flex:1;display:flex"></div></div>
</div>
<div id="toast"></div>

<script>
"use strict";
const PLATFORMS={ "Claude":"https://claude.ai", "ChatGPT":"https://chatgpt.com", "Gemini":"https://gemini.google.com", "Copilot":"https://copilot.microsoft.com" };
const LS="aibridge.panes";
let panes=JSON.parse(localStorage.getItem(LS)||"null")||[
  {id:"p1",platform:"Claude",label:"Claude — account 1"},
  {id:"p2",platform:"ChatGPT",label:"ChatGPT"}
];
let left=panes[0]?.id, right=panes[1]?.id;
const views={}; // id -> webview element (kept alive, just re-slotted)

function save(){ localStorage.setItem(LS,JSON.stringify(panes)); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none",2500); }

function getView(p){
  if(views[p.id]) return views[p.id];
  const w=document.createElement("webview");
  w.src=PLATFORMS[p.platform];
  // ponytail: persist:<id> = isolated cookie jar per pane — this is what allows 2 Claude accounts at once
  w.setAttribute("partition","persist:"+p.id);
  w.setAttribute("allowpopups","");
  views[p.id]=w;
  return w;
}

function render(){
  const tabs=document.getElementById("tabs"); tabs.innerHTML="";
  panes.forEach(p=>{
    const t=document.createElement("span");
    t.className="tab"+(p.id===left?" left":"")+(p.id===right?" right":"");
    t.textContent=p.label;
    const x=document.createElement("span"); x.className="x"; x.textContent="×";
    x.onclick=e=>{e.stopPropagation();
      if(!confirm("Remove \""+p.label+"\"? (Its login session cookie jar stays on disk and returns if re-added with the same slot number.)"))return;
      panes=panes.filter(q=>q.id!==p.id); delete views[p.id];
      if(left===p.id)left=panes[0]?.id; if(right===p.id)right=panes.find(q=>q.id!==left)?.id;
      save(); render();
    };
    t.appendChild(x);
    t.onclick=e=>{ if(e.ctrlKey){right=p.id;} else {left=p.id; if(right===p.id) right=panes.find(q=>q.id!==p.id)?.id;} render(); };
    tabs.appendChild(t);
  });
  slot("slotL","labL",left,"LEFT");
  slot("slotR","labR",right,"RIGHT");
}
function slot(slotId,labId,paneId,side){
  const s=document.getElementById(slotId);
  // move, never destroy — destroying a webview reloads it
  Array.from(s.children).forEach(c=>{ if(c!==views[paneId]) s.removeChild(c); });
  const p=panes.find(q=>q.id===paneId);
  document.getElementById(labId).textContent=p?(side+" · "+p.label):"— add a pane —";
  if(p){ const v=getView(p); if(v.parentElement!==s) s.appendChild(v); }
}

function addPane(){
  const plat=prompt("Platform? (Claude / ChatGPT / Gemini / Copilot)","Claude");
  if(!plat||!PLATFORMS[plat.trim()])return alert("Pick one of: "+Object.keys(PLATFORMS).join(", "));
  const label=prompt("Label (e.g. 'Claude — work account'):",plat.trim())||plat.trim();
  const id="p"+Date.now();
  panes.push({id,platform:plat.trim(),label});
  if(!left)left=id; else if(!right)right=id;
  save(); render();
}

/* ---- sharing ---- */
const EXTRACT=`(function(){
  /* per-site user/assistant selector pairs — capture BOTH sides, labeled, in order */
  var sites=[
    {u:'[data-testid="user-message"]', a:'.font-claude-message, .font-claude-response, [data-testid="assistant-message"], [data-test-render-count] .standard-markdown'}, /* claude.ai */
    {u:'[data-message-author-role="user"]', a:'[data-message-author-role="assistant"]'},  /* chatgpt */
    {u:'user-query', a:'message-content'},                                                /* gemini */
    {u:'[data-content="user-message"]', a:'[data-content="ai-message"]'}                  /* copilot */
  ];
  var t="";
  for(var i=0;i<sites.length;i++){
    var s=sites[i], els=document.querySelectorAll(s.u+", "+s.a);
    if(els.length){
      var seen=[], out=[];
      els.forEach(function(e){
        /* skip elements nested inside an already-captured element (selector overlap) */
        for(var j=0;j<seen.length;j++){ if(seen[j].contains(e)) return; }
        seen.push(e);
        var role=e.matches(s.u) ? "USER" : "ASSISTANT";
        var txt=e.innerText.trim();
        if(txt) out.push(role+":\\n"+txt);
      });
      t=out.join("\\n\\n");
      if(t.length>=20) break;
    }
  }
  /* fallback: main content minus sidebar/nav */
  if(t.length<20){
    var m=(document.querySelector('main')||document.body).cloneNode(true);
    m.querySelectorAll('nav,aside,header,[class*="sidebar" i],[class*="nav" i]').forEach(function(n){n.remove();});
    t=m.innerText||"";
  }
  /* keep up to ~120k chars (roughly 30k tokens); trim from the START so the newest context survives */
  return t.length>120000 ? "[...earlier conversation trimmed...]\\n"+t.slice(-120000) : t;
})()`;

function insertScript(text){
  const payload=JSON.stringify(
    "You are taking over an in-progress conversation from another AI assistant whose usage limit was reached. Below is the transcript (most recent part). Continue the work from where it left off — do not restart or re-explain.\n\n---TRANSCRIPT---\n"+text
  );
  // ponytail: selector list per site, generic fallback last — brittle by nature, update when a site redesigns
  return `(function(){
    var sels=['div[contenteditable="true"].ProseMirror','#prompt-textarea','div[contenteditable="true"]','rich-textarea div[contenteditable="true"]','textarea'];
    var el=null;
    for(var i=0;i<sels.length;i++){ var c=document.querySelectorAll(sels[i]); if(c.length){ el=c[c.length-1]; break; } }
    if(!el) return "NOINPUT";
    el.focus();
    document.execCommand("selectAll",false,null);
    document.execCommand("insertText",false,${payload});
    return "OK";
  })()`;
}

async function share(reverse){
  const srcId=reverse?right:left, dstId=reverse?left:right;
  const src=views[srcId], dst=views[dstId];
  if(!src||!dst) return toast("Need two panes open");
  try{
    const text=await src.executeJavaScript(EXTRACT);
    if(!text||text.trim().length<20) return toast("Nothing to share in source pane");
    const res=await dst.executeJavaScript(insertScript(text));
    toast(res==="OK" ? "Dropped into target input — review and press Enter there" : "Couldn't find target input box — is a chat open?");
  }catch(e){ toast("Share failed: "+e.message); }
}

render();
</script>
</body>
</html>
